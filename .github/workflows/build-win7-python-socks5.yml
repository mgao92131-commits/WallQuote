name: Build Win7 Python SOCKS5

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/win7-socks5-python/**'
      - '.github/workflows/build-win7-python-socks5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 8, 10)"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==5.13.2

      - name: Build console and background EXEs
        working-directory: tools/win7-socks5-python
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name lan-socks5-python-win7-console server.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name lan-socks5-python-win7 server.py
          Copy-Item dist\lan-socks5-python-win7-console.exe .
          Copy-Item dist\lan-socks5-python-win7.exe .
          (Get-FileHash .\lan-socks5-python-win7-console.exe -Algorithm SHA256).Hash.ToLower() + '  lan-socks5-python-win7-console.exe' | Out-File -Encoding ascii .\lan-socks5-python-win7-console.exe.sha256
          (Get-FileHash .\lan-socks5-python-win7.exe -Algorithm SHA256).Hash.ToLower() + '  lan-socks5-python-win7.exe' | Out-File -Encoding ascii .\lan-socks5-python-win7.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-python-socks5-x64
          path: |
            tools/win7-socks5-python/lan-socks5-python-win7-console.exe
            tools/win7-socks5-python/lan-socks5-python-win7-console.exe.sha256
            tools/win7-socks5-python/lan-socks5-python-win7.exe
            tools/win7-socks5-python/lan-socks5-python-win7.exe.sha256
            tools/win7-socks5-python/server.py
          if-no-files-found: error
