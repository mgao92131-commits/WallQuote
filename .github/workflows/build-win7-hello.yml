name: Build Win7 Hello World

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/hello-win7/**'
      - '.github/workflows/build-win7-hello.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            output: hello-win7-x64.exe
          - arch: '386'
            output: hello-win7-x86.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.20.14
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Verify toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.20.14"

      - name: Build Windows executable
        working-directory: tools/hello-win7
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-s -w' -o "${{ matrix.output }}" .
          sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-win7-${{ matrix.arch }}
          path: |
            tools/hello-win7/${{ matrix.output }}
            tools/hello-win7/${{ matrix.output }}.sha256
          if-no-files-found: error
